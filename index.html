<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IMC72s — ช่องทาง</title>

  <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap:wght@300;400;600&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1: #0f1226;
      --bg2: #0b1630;
      --accent1: #9b5cff;
      --accent2: #55d8ff;
      --text: #eaf6ff;
      --muted: rgba(234,246,255,0.7);
      --sparkle: rgba(255,255,255,0.3);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family:'Kanit','Comic Neue',sans-serif;background:var(--bg1);color:var(--text);overflow-x:hidden;}
    body{background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);}

    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px;position:relative;z-index:1;}

    .card{
      width:100%;max-width:980px;
      background:rgba(20,20,40,0.85);
      border-radius:18px;padding:32px;position:relative;overflow:hidden;
      backdrop-filter: blur(12px);
      box-shadow:0 10px 40px rgba(0,0,0,0.6);
      border:1px solid rgba(255,255,255,0.08);
      animation:fadeIn 1s ease;
    }

    @keyframes fadeIn {from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)}}

    .header{display:flex;gap:16px;align-items:center}
    .avatar{width:96px;height:96px;border-radius:18px;overflow:hidden;flex:0 0 96px}
    .avatar img{width:100%;height:100%;object-fit:cover;animation:avatarPop 2s infinite alternate;}

    @keyframes avatarPop {from{transform:scale(1)} to{transform:scale(1.05)}}

    .title{flex:1}
    .title h1{margin:0;font-size:22px;color:var(--text);letter-spacing:1px}
    .title p{margin:6px 0 0;color:var(--muted);font-size:14px}

    .links{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
    @media(max-width:820px){.links{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:520px){.links{grid-template-columns:1fr}}

    .link-card{
      background:rgba(30,30,50,0.7);
      border-radius:14px;padding:14px;
      display:flex;gap:12px;align-items:center;
      border:1px solid rgba(155,92,255,0.2);
      transition:all .4s ease;
      position:relative;
      overflow:hidden;
      cursor:pointer;
      animation:cardFade .8s forwards;
    }

    .link-card:nth-child(1){animation-delay:.2s}
    .link-card:nth-child(2){animation-delay:.35s}
    .link-card:nth-child(3){animation-delay:.5s}
    .link-card:nth-child(4){animation-delay:.65s}
    .link-card:nth-child(5){animation-delay:.8s}
    .link-card:nth-child(6){animation-delay:.95s}

    @keyframes cardFade {to{opacity:1;transform:translateY(0)}}

    .link-card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 15px 35px rgba(155,92,255,0.3);}

    .link-card .logo{width:54px;height:54px;border-radius:50%;flex:0 0 54px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.08);position:relative;overflow:hidden}
    .link-card .logo img{width:54px;height:54px;object-fit:cover;}

    .link-card .meta h3{margin:0;font-size:15px;background:linear-gradient(90deg,var(--accent1),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .link-card .meta p{margin:4px 0 0;font-size:12px;color:var(--muted)}

    .footer{margin-top:18px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}

    .brand-stroke{font-weight:700;padding:6px 12px;border-radius:999px;background:linear-gradient(90deg,rgba(155,92,255,0.18),rgba(85,216,255,0.12))}

    .site-label{font-size:15px;font-weight:700;background:linear-gradient(90deg,var(--accent1),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;transition:opacity .3s}
    .site-label:hover{opacity:.7}

    /* Sparkle background */
    .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--sparkle);
      border-radius: 50%;
      pointer-events: none;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {transform: translateY(0) scale(1); opacity:1;}
      100% {transform: translateY(-200px) scale(0.5); opacity:0;}
    }

    /* Mouse trail effect */
    .trail {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius:50%;
      background: linear-gradient(45deg,var(--accent1),var(--accent2));
      pointer-events:none;
      mix-blend-mode: lighten;
      animation:trailFade 0.6s forwards;
    }

    @keyframes trailFade {from{opacity:1} to{opacity:0;transform:scale(0)}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header">
        <div class="avatar"><img src="https://i.ibb.co/5h7xwZgF/2ce776fd9d749cf001429d01929d1068-tplv-tiktokx-cropcenter-1080-1080.jpg"></div>
        <div class="title">
          <h1>IMC72s <span class="brand-stroke">ALL SOCAILS</span></h1>
          <p>Socails — Instagram, TikTok, X, Roblox</p>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">
          <div class="site-label" id="copyBtn">CARAMEL SITE</div>
          <div style="font-size:12px;color:var(--muted)">CLICK HERE TO COPY ALL LINK</div>
        </div>
      </div>

      <div class="links" id="linksList">
        <a class="link-card" href="https://www.instagram.com/imc72s/" target="_blank">
          <div class="logo"><img src="https://i.ibb.co/nN2cnmC7/63-20250721174458.png"></div>
          <div class="meta"><h3>Instagram</h3><p>@imc72s</p></div>
        </a>

        <a class="link-card" href="https://www.tiktok.com/@imc72s" target="_blank">
          <div class="logo"><img src="https://i.ibb.co/Xfdj4RZh/63-20250721174435.png"></div>
          <div class="meta"><h3>TikTok</h3><p>@imc72s</p></div>
        </a>

        <a class="link-card" href="https://x.com/imc72s" target="_blank">
          <div class="logo"><img src="https://i.ibb.co/8QX4p2G/63-20250721174520.png"></div>
          <div class="meta"><h3>X (Twitter)</h3><p>@imc72s</p></div>
        </a>

        <a class="link-card" href="https://www.roblox.com/users/8555835580/profile" target="_blank">
          <div class="logo"><img src="https://i.ibb.co/HpnT0vTL/image.png"></div>
          <div class="meta"><h3>@4Q4II</h3><p>PROFILE</p></div>
        </a>

        <a class="link-card" href="https://www.roblox.com/users/5162631610/profile" target="_blank">
          <div class="logo"><img src="https://i.ibb.co/HpnT0vTL/image.png"></div>
          <div class="meta"><h3>@IMCOOL08972</h3><p>PROFILE</p></div>
        </a>

        <a class="link-card" href="https://www.roblox.com/users/8555790190/profile" target="_blank">
          <div class="logo"><img src="https://i.ibb.co/HpnT0vTL/image.png"></div>
          <div class="meta"><h3>@4Q4ll</h3><p>PROFILE</p></div>
        </a>
      </div>

      <div class="footer">
        <div>HELLO WELCOME TO MY SITE !</div>
        <div>MADE BY CARAMEL</div>
      </div>
    </div>
  </div>

  <script>
    const copyBtn=document.getElementById('copyBtn');
    copyBtn.addEventListener('click',()=>{
      const links = Array.from(document.querySelectorAll('.link-card')).map(l => l.href).join('\n');
      navigator.clipboard.writeText(links);
      alert('COPIE !');
    });

    for(let i=0;i<60;i++){
      let sparkle = document.createElement('div');
      sparkle.classList.add('sparkle');
      sparkle.style.left = Math.random()*window.innerWidth+'px';
      sparkle.style.top = Math.random()*window.innerHeight+'px';
      sparkle.style.width = sparkle.style.height = (Math.random()*3 + 2)+'px';
      sparkle.style.animationDuration = (Math.random()*5 + 3)+'s';
      document.body.appendChild(sparkle);
    }

    document.addEventListener('mousemove', e => {
      let trail = document.createElement('div');
      trail.classList.add('trail');
      trail.style.left = e.clientX+'px';
      trail.style.top = e.clientY+'px';
      document.body.appendChild(trail);
      setTimeout(()=>trail.remove(),600);
    });
  </script>
</body>
</html>
